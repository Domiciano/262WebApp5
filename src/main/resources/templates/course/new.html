<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Nuevo curso</title>
</head>
<body>
    <h1>Nuevo curso</h1>
    <form method="post"
          th:object="${course}"
          th:action="@{/course/save}"
    >
        <input type="text"
               placeholder="Nombre del curso"
               th:field="*{name}">

        <input type="number"
               min="0"
               max="10"
               placeholder="Creditos"
               th:field="*{credits}">

        <select th:field="*{professor}">
            <option th:each="prof : ${professors}"
                    th:value="${prof.id}"
                    th:text="${prof.name}">
            </option>
        </select>



        <button>Crear</button>

    </form>
</body>
</html>
