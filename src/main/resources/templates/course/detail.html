<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Detailed Course</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>
<body class="page detail-page">
    <h1 class="course-name"><span class="course-name-text" th:text="${course.name}"></span></h1>
    <p class="course-professor" th:text="${course.professor.name}"></p>
    <p class="course-credits">La materia tiene <span class="credits-value" th:text="${course.credits}"></span> créditos </p>

</body>
</html>
